<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking</title>

<style>
.timeline {
  position: relative;
  margin-top: 30px;
  padding-left: 10px;
}

/* 中心線 */
.timeline::before {
  content: "";
  position: absolute;
  left: 17px;
  top: 10px;
  bottom: 0;
  width: 1.5px;
  background: #e5e7eb;
}

/* 每一列 */
.step {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 34px;
}

/* icon 外框 */
.icon {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: #f5f6f7;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

/* 完成 */
.step.done .icon {
  background: transparent;
}

/* 當前 */
.step.active .icon {
  background: #111827;
}

/* SVG */
.icon svg {
  width: 16px;
  height: 16px;
  stroke: #c0c4c9;
}

/* 已完成（淡灰勾） */
.step.done svg {
  stroke: #9ca3af;
}

/* 當前 */
.step.active svg {
  stroke: white;
}

/* 文字 */
.title-step {
  font-size: 15px;
  color: #9ca3af;
}

/* 已完成 */
.step.done .title-step {
  color: #6b7280;
}

/* 當前 */
.step.active .title-step {
  color: #111827;
  font-weight: 600;
}

/* 當前標籤 */
.current-tag {
  margin-top: 6px;
  font-size: 12px;
  background: #111827;
  color: white;
  padding: 4px 10px;
  border-radius: 6px;
}

/* 時間 */
.time {
  font-size: 12px;
  color: #9ca3af;
  margin-top: 6px;
}
</style>
</head>

<body>

<div class="header">
  <div>by Eliss Collection</div>
  <div onclick="toggleLang()" style="cursor:pointer;">EN</div>
</div>

<div class="container">

<div class="title" id="title">訂單追蹤</div>

<div class="search-box">
  <input id="orderId" placeholder="輸入訂單編號">
  <button onclick="checkOrder()" id="btn">查詢</button>
</div>

<div id="card"></div>
<div id="timeline"></div>

</div>

<script>
let lang="zh";

/* 語系 */
const text = {
  zh:{title:"訂單追蹤",btn:"查詢",current:"目前進度"},
  en:{title:"Order Tracking",btn:"Search",current:"Current"}
};

function toggleLang(){
  lang = lang==="zh"?"en":"zh";
  document.getElementById("title").innerText=text[lang].title;
  document.getElementById("btn").innerText=text[lang].btn;
}

/* icon */
function icon(name){
  const i={
    check:`<svg fill="none" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>`,
    plane:`<svg fill="none" stroke-width="2"><path d="M2 16l20-8-8 20"/></svg>`,
    box:`<svg fill="none" stroke-width="2"><path d="M3 7l9-4 9 4-9 4z"/></svg>`
  };
  return i[name]||i.check;
}

/* steps */
const steps=[
"已接收訂單","正在採購","採購完成，前往海外轉運站",
"已抵達海外轉運站","前往海外機場","抵達海外機場，理貨中",
"已上飛機","抵達台灣，清關中","已入庫台灣工作室",
"出貨包裝中","已寄出，請準備收貨"
];

/* 查詢 */
async function checkOrder(){

  /* skeleton */
  document.getElementById("card").innerHTML=`
  <div class="card">
    <div class="skeleton" style="height:14px;width:70%;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:14px;width:50%;"></div>
  </div>`;

  document.getElementById("timeline").innerHTML=`
  <div class="skeleton" style="height:200px;"></div>`;

  const res = await fetch(`https://script.google.com/macros/s/AKfycbwEq4xA34BwxsPlfbQq2akALTk0X4g6ICvpPc8qUdxkeKT4TVNN5qfBK4ET8beIREhtaA/exec?email=test&orderId=${orderId.value}`);
  const data = await res.json();

  /* 商品卡片 */
  document.getElementById("card").innerHTML=`
  <div class="card">
    <div class="product">訂單編號：${orderId.value}</div>
    <div class="product">狀態：${data.status}</div>
  </div>`;

  const index = steps.indexOf(data.status);
  renderTimeline(index>=0?index:0);
}

/* timeline */
function renderTimeline(current){
  const el=document.getElementById("timeline");
  el.innerHTML="";

  steps.forEach((s,i)=>{
    let c=i<current?"done":i===current?"active":"";

    el.innerHTML+=`
    <div class="step ${c}">
      <div class="icon">${icon(i===current?"plane":"check")}</div>
      <div>
        <div class="title-step">${s}</div>
        ${i===current?`<div class="current-tag">${text[lang].current}</div>
        <div class="time">${new Date().toLocaleString()}</div>`:""}
      </div>
    </div>`;
  });
}
</script>

</body>
</html>
