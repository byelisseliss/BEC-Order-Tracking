<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>訂單查詢</title>
  <style>

    .timeline {
  width: 460px;
  margin: 60px auto;
  position: relative;
  text-align: left;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 20px;
  top: 6px;
  bottom: 0;
  width: 1.5px;
  background: #e6e8eb;
}

.step {
  display: flex;
  gap: 18px;
  margin-bottom: 38px;
  position: relative;
}

.icon {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: #f3f4f6;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.step.done .icon {
  background: #2b2f33;
}

.step.active .icon {
  background: #111827;
}

.icon svg {
  width: 18px;
  height: 18px;
  stroke: #9ca3af;
}

.step.done svg,
.step.active svg {
  stroke: #ffffff;
}

.content {
  margin-top: 4px;
}

.title {
  font-size: 15px;
  color: #9ca3af;
  letter-spacing: 0.2px;
}

.step.done .title,
.step.active .title {
  color: #111827;
  font-weight: 500;
}

.current-tag {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 10px;
  font-size: 12px;
  background: #111827;
  color: #ffffff;
  border-radius: 6px;
}

.time {
  margin-top: 6px;
  font-size: 12px;
  color: #9ca3af;
}

  
  
  </style>
</head>
<body>

  <h2>訂單查詢</h2>

  <input id="email" placeholder="輸入 Email"><br>
  <input id="orderId" placeholder="輸入訂單編號"><br><br>

  <button onclick="checkOrder()">查詢</button>

  <h3 id="result"></h3>


<div id="timeline" class="timeline"></div>
  
  <script>

   <script>
const steps = [
  { text: "已接收訂單", icon: "check" },
  { text: "正在採購", icon: "check" },
  { text: "採購完成，前往海外轉運站", icon: "check" },
  { text: "已抵達海外轉運站", icon: "warehouse" },
  { text: "前往海外機場", icon: "truck" },
  { text: "抵達海外機場，理貨中", icon: "box" },
  { text: "已上飛機", icon: "plane" },
  { text: "抵達台灣，清關中", icon: "location" },
  { text: "已入庫台灣工作室", icon: "building" },
  { text: "出貨包裝中", icon: "gift" },
  { text: "已寄出，請準備收貨", icon: "spark" }
];

function getIcon(name) {
  const icons = {
    check: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>`,
    warehouse: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10H3z"/><path d="M9 22V12h6v10"/></svg>`,
    truck: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7h13v10H3z"/><path d="M16 10h4l2 3v4h-6z"/></svg>`,
    box: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>`,
    plane: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M2 16l20-8-8 20-2-8-10-4z"/></svg>`,
    location: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M12 21s-6-5.4-6-10a6 6 0 1112 0c0 4.6-6 10-6 10z"/></svg>`,
    building: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M4 22V2h16v20"/><path d="M9 22V12h6v10"/></svg>`,
    gift: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/></svg>`,
    spark: `<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4 12H2M22 12h-2M5 5l-2-2M21 21l-2-2"/></svg>`
  };
  return icons[name] || "";
}

async function checkOrder() {
  const email = document.getElementById("email").value;
  const orderId = document.getElementById("orderId").value;

  const res = await fetch(`https://script.google.com/macros/s/AKfycbwEq4xA34BwxsPlfbQq2akALTk0X4g6ICvpPc8qUdxkeKT4TVNN5qfBK4ET8beIREhtaA/exec?email=${email}&orderId=${orderId}`);
  const data = await res.json();

  document.getElementById("result").innerText = "訂單狀態：" + data.status;

  const index = steps.findIndex(s => s.text === data.status);
  renderTimeline(index >= 0 ? index : 0);
}

function renderTimeline(currentIndex) {
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";

  steps.forEach((step, i) => {
    let cls = "";
    if (i < currentIndex) cls = "done";
    else if (i === currentIndex) cls = "active";

    const el = document.createElement("div");
    el.className = `step ${cls}`;

    el.innerHTML = `
      <div class="icon">${getIcon(step.icon)}</div>
      <div class="content">
        <div class="title">${step.text}</div>
        ${
          i === currentIndex
            ? `<div class="current-tag">目前進度</div>
               <div class="time">${new Date().toLocaleString()}</div>`
            : ""
        }
      </div>
    `;

    timeline.appendChild(el);
  });
}


  </script>

</body>
</html>
