<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>訂單查詢</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }
    input {
      padding: 10px;
      margin: 5px;
      width: 250px;
    }
    button {
      padding: 10px 20px;
      cursor: pointer;
    }

/* 🚛 status line */
.timeline {
  width: 420px;
  margin: 60px auto;
  position: relative;
  text-align: left;
}

/* 垂直線 */
.timeline::before {
  content: "";
  position: absolute;
  left: 18px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #e5e7eb;
}

/* 每一列 */
.step {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 34px;
  position: relative;
}

/* icon 方塊 */
.icon {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: #f3f4f6;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9ca3af;
  font-size: 14px;
  z-index: 1;
}

/* 已完成 */
.step.done .icon {
  background: #2f343a;
  color: #ffffff;
}

/* 當前 */
.step.active .icon {
  background: #1f2937;
  color: #ffffff;
}

/* 文字區 */
.content {
  margin-top: 4px;
}

/* 標題 */
.title {
  font-size: 15px;
  color: #9ca3af;
  letter-spacing: 0.2px;
}

/* 完成 & 當前 */
.step.done .title,
.step.active .title {
  color: #111827;
  font-weight: 500;
}

/* 當前標籤 */
.current-tag {
  display: inline-block;
  margin-top: 8px;
  padding: 4px 10px;
  font-size: 12px;
  background: #1f2937;
  color: #ffffff;
  border-radius: 6px;
}

/* 時間 */
.time {
  margin-top: 6px;
  font-size: 12px;
  color: #9ca3af;
}

  
  
  </style>
</head>
<body>

  <h2>訂單查詢</h2>

  <input id="email" placeholder="輸入 Email"><br>
  <input id="orderId" placeholder="輸入訂單編號"><br><br>

  <button onclick="checkOrder()">查詢</button>

  <h3 id="result"></h3>


<div id="timeline" class="timeline"></div>
  
  <script>

    const steps = [
  "已接收訂單",
  "正在採購",
  "採購完成，前往海外轉運站",
  "已抵達海外轉運站",
  "前往海外機場",
  "抵達海外機場，理貨中",
  "已上飛機",
  "抵達台灣，清關中",
  "已入庫台灣工作室",
  "出貨包裝中",
  "已寄出，請準備收貨"
];

async function checkOrder() {
  const email = document.getElementById("email").value;
  const orderId = document.getElementById("orderId").value;

  const res = await fetch(`https://script.google.com/macros/s/AKfycbwEq4xA34BwxsPlfbQq2akALTk0X4g6ICvpPc8qUdxkeKT4TVNN5qfBK4ET8beIREhtaA/exec?email=${email}&orderId=${orderId}`);
  const data = await res.json();

  document.getElementById("result").innerText = "訂單狀態：" + data.status;

  const stepIndex = steps.indexOf(data.status);
  renderTimeline(stepIndex >= 0 ? stepIndex : 0);
}

function renderTimeline(currentStepIndex) {
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";

  steps.forEach((text, index) => {
    let statusClass = "";

    if (index < currentStepIndex) statusClass = "done";
    else if (index === currentStepIndex) statusClass = "active";

    const stepEl = document.createElement("div");
    stepEl.className = `step ${statusClass}`;

    stepEl.innerHTML = `
      <div class="icon">
        ${index < currentStepIndex ? "✓" : ""}
      </div>
      <div class="content">
        <div class="title">${text}</div>
        ${
          index === currentStepIndex
            ? `<div class="current-tag">目前進度</div>
               <div class="time">${new Date().toLocaleString()}</div>`
            : ""
        }
      </div>
    `;

    timeline.appendChild(stepEl);
  });
}

  </script>

</body>
</html>
