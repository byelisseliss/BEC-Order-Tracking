<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>訂單查詢</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f7f7f8;
  margin: 0;
}

/* Header */
.header {
  text-align: center;
  padding: 20px;
  font-size: 14px;
  color: #6b7280;
}

/* Container */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 20px;
}

/* Title */
.title {
  text-align: center;
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 10px;
}

/* Search */
.search-box {
  display: flex;
  gap: 10px;
  margin: 20px 0 30px;
}

.search-box input {
  flex: 1;
  padding: 12px;
  border: 1px solid #e5e7eb;
  font-size: 14px;
}

.search-box button {
  background: #111827;
  color: white;
  border: none;
  padding: 12px 20px;
  cursor: pointer;
}

/* Card */
.card {
  background: white;
  border: 1px solid #e5e7eb;
  padding: 20px;
  margin-bottom: 30px;
}

.card-item {
  margin-bottom: 10px;
  font-size: 14px;
}

/* Timeline */
.timeline {
  position: relative;
  margin-top: 20px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 18px;
  top: 6px;
  bottom: 0;
  width: 1.5px;
  background: #e5e7eb;
}

.step {
  display: flex;
  gap: 16px;
  margin-bottom: 34px;
}

.icon {
  width: 36px;
  height: 36px;
  border-radius: 6px;
  background: #f3f4f6;
  display: flex;
  align-items: center;
  justify-content: center;
}

.step.done .icon {
  background: #2f343a;
}

.step.active .icon {
  background: #111827;
}

.icon svg {
  width: 18px;
  height: 18px;
  stroke: #9ca3af;
}

.step.done svg,
.step.active svg {
  stroke: white;
}

.title-step {
  font-size: 15px;
  color: #9ca3af;
}

.step.done .title-step,
.step.active .title-step {
  color: #111827;
  font-weight: 500;
}

.current-tag {
  margin-top: 6px;
  font-size: 12px;
  background: #111827;
  color: white;
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
}

.time {
  font-size: 12px;
  color: #9ca3af;
  margin-top: 6px;
}
</style>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
</head>

<body>

<div class="header">by Eliss Collection</div>

<div class="container">

<div class="title">訂單追蹤</div>

<div class="search-box">
  <input id="orderId" placeholder="輸入訂單編號">
  <button onclick="checkOrder()">查詢</button>
</div>

<div id="card" class="card" style="display:none;">
  <div class="card-item" id="orderInfo"></div>
</div>

<div id="timeline" class="timeline"></div>

</div>

<script>
const steps = [
  { text: "已接收訂單", icon: "check" },
  { text: "正在採購", icon: "check" },
  { text: "採購完成，前往海外轉運站", icon: "check" },
  { text: "已抵達海外轉運站", icon: "warehouse" },
  { text: "前往海外機場", icon: "truck" },
  { text: "抵達海外機場，理貨中", icon: "box" },
  { text: "已上飛機", icon: "plane" },
  { text: "抵達台灣，清關中", icon: "location" },
  { text: "已入庫台灣工作室", icon: "building" },
  { text: "出貨包裝中", icon: "gift" },
  { text: "已寄出，請準備收貨", icon: "spark" }
];

function getIcon(name) {
  const icons = {
    check:`<svg fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>`,
    warehouse:`<svg fill="none" stroke-width="2"><path d="M3 10l9-7 9 7v10H3z"/></svg>`,
    truck:`<svg fill="none" stroke-width="2"><path d="M3 7h13v10H3z"/></svg>`,
    box:`<svg fill="none" stroke-width="2"><path d="M3 7l9-4 9 4-9 4z"/></svg>`,
    plane:`<svg fill="none" stroke-width="2"><path d="M2 16l20-8-8 20z"/></svg>`,
    location:`<svg fill="none" stroke-width="2"><path d="M12 21s-6-5-6-10a6 6 0 1112 0c0 5-6 10-6 10z"/></svg>`,
    building:`<svg fill="none" stroke-width="2"><path d="M4 22V2h16v20"/></svg>`,
    gift:`<svg fill="none" stroke-width="2"><path d="M20 12v10H4V12"/></svg>`,
    spark:`<svg fill="none" stroke-width="2"><path d="M12 2v4M12 18v4"/></svg>`
  };
  return icons[name];
}

async function checkOrder() {
  const orderId = document.getElementById("orderId").value;

  const res = await fetch(`https://script.google.com/macros/s/AKfycbwEq4xA34BwxsPlfbQq2akALTk0X4g6ICvpPc8qUdxkeKT4TVNN5qfBK4ET8beIREhtaA/exec?email=test&orderId=${orderId}`);
  const data = await res.json();

  document.getElementById("card").style.display = "block";
  document.getElementById("orderInfo").innerText = "訂單編號：" + orderId;

  const index = steps.findIndex(s => s.text === data.status);
  renderTimeline(index >= 0 ? index : 0);
}

function renderTimeline(currentIndex) {
  const timeline = document.getElementById("timeline");
  timeline.innerHTML = "";

  steps.forEach((step, i) => {
    let cls = "";
    if (i < currentIndex) cls = "done";
    else if (i === currentIndex) cls = "active";

    const el = document.createElement("div");
    el.className = `step ${cls}`;

    el.innerHTML = `
      <div class="icon">${getIcon(step.icon)}</div>
      <div>
        <div class="title-step">${step.text}</div>
        ${i === currentIndex ? `<div class="current-tag">目前進度</div>
        <div class="time">${new Date().toLocaleString()}</div>` : ""}
      </div>
    `;

    timeline.appendChild(el);
  });
}
</script>

</body>
</html>
