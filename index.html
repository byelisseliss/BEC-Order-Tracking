<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f6f7f9;
  margin: 0;
}

/* header */
.header {
  display:flex;
  justify-content:space-between;
  padding:16px 20px;
  font-size:14px;
  color:#6b7280;
}

/* container */
.container {
  max-width:720px;
  margin:auto;
  padding:20px;
}

/* title */
.title {
  text-align:center;
  font-size:26px;
  font-weight:600;
}

/* search */
.search-box {
  display:flex;
  gap:10px;
  margin:20px 0;
}

@media(max-width:640px){
  .search-box{flex-direction:column;}
}

input {
  flex:1;
  padding:14px;
  border:1px solid #e5e7eb;
  border-radius:8px;
}

button {
  padding:14px;
  background:#111827;
  color:white;
  border:none;
  border-radius:8px;
}

/* card */
.card {
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:16px;
  margin-bottom:20px;
}

.product {
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:6px;
}

/* skeleton */
.skeleton {
  background: linear-gradient(90deg,#eee,#ddd,#eee);
  background-size:200% 100%;
  animation: loading 1.2s infinite;
  border-radius:6px;
}

@keyframes loading {
  0% {background-position:200% 0;}
  100% {background-position:-200% 0;}
}

/* timeline */
.timeline {
  position:relative;
}

.timeline::before {
  content:"";
  position:absolute;
  left:16px;
  top:6px;
  bottom:0;
  width:2px;
  background:#e5e7eb;
}

.step {
  display:flex;
  gap:14px;
  margin-bottom:28px;
}

.icon {
  width:32px;
  height:32px;
  border-radius:8px;
  background:#f3f4f6;
  display:flex;
  align-items:center;
  justify-content:center;
}

.step.done .icon {background:#2f343a;}
.step.active .icon {background:#111827;}

.icon svg {width:16px;height:16px;stroke:#9ca3af;}
.step.done svg,.step.active svg {stroke:white;}

.title-step {font-size:15px;color:#9ca3af;}
.step.done .title-step,.step.active .title-step {color:#111827;font-weight:500;}

.current-tag {
  margin-top:6px;
  font-size:12px;
  background:#111827;
  color:white;
  padding:4px 8px;
  border-radius:6px;
}

.time {
  font-size:12px;
  color:#9ca3af;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="header">
  <div>by Eliss Collection</div>
  <div onclick="toggleLang()" style="cursor:pointer;">EN</div>
</div>

<div class="container">

<div class="title" id="title">訂單追蹤</div>

<div class="search-box">
  <input id="orderId" placeholder="輸入訂單編號">
  <button onclick="checkOrder()" id="btn">查詢</button>
</div>

<div id="card"></div>
<div id="timeline"></div>

</div>

<script>
let lang="zh";

/* 語系 */
const text = {
  zh:{title:"訂單追蹤",btn:"查詢",current:"目前進度"},
  en:{title:"Order Tracking",btn:"Search",current:"Current"}
};

function toggleLang(){
  lang = lang==="zh"?"en":"zh";
  document.getElementById("title").innerText=text[lang].title;
  document.getElementById("btn").innerText=text[lang].btn;
}

/* icon */
function icon(name){
  const i={
    check:`<svg fill="none" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>`,
    plane:`<svg fill="none" stroke-width="2"><path d="M2 16l20-8-8 20"/></svg>`,
    box:`<svg fill="none" stroke-width="2"><path d="M3 7l9-4 9 4-9 4z"/></svg>`
  };
  return i[name]||i.check;
}

/* steps */
const steps=[
"已接收訂單","正在採購","採購完成，前往海外轉運站",
"已抵達海外轉運站","前往海外機場","抵達海外機場，理貨中",
"已上飛機","抵達台灣，清關中","已入庫台灣工作室",
"出貨包裝中","已寄出，請準備收貨"
];

/* 查詢 */
async function checkOrder(){

  /* skeleton */
  document.getElementById("card").innerHTML=`
  <div class="card">
    <div class="skeleton" style="height:14px;width:70%;margin-bottom:10px;"></div>
    <div class="skeleton" style="height:14px;width:50%;"></div>
  </div>`;

  document.getElementById("timeline").innerHTML=`
  <div class="skeleton" style="height:200px;"></div>`;

  const res = await fetch(`https://script.google.com/macros/s/AKfycbwEq4xA34BwxsPlfbQq2akALTk0X4g6ICvpPc8qUdxkeKT4TVNN5qfBK4ET8beIREhtaA/exec?email=test&orderId=${orderId.value}`);
  const data = await res.json();

  /* 商品卡片 */
  document.getElementById("card").innerHTML=`
  <div class="card">
    <div class="product">訂單編號：${orderId.value}</div>
    <div class="product">狀態：${data.status}</div>
  </div>`;

  const index = steps.indexOf(data.status);
  renderTimeline(index>=0?index:0);
}

/* timeline */
function renderTimeline(current){
  const el=document.getElementById("timeline");
  el.innerHTML="";

  steps.forEach((s,i)=>{
    let c=i<current?"done":i===current?"active":"";

    el.innerHTML+=`
    <div class="step ${c}">
      <div class="icon">${icon(i===current?"plane":"check")}</div>
      <div>
        <div class="title-step">${s}</div>
        ${i===current?`<div class="current-tag">${text[lang].current}</div>
        <div class="time">${new Date().toLocaleString()}</div>`:""}
      </div>
    </div>`;
  });
}
</script>

</body>
</html>
